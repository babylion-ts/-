<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>혁특 노방 분석실</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --border:#e6e8ec;
  --text:#1b1f24; --muted:#6b7280; --faint:#9aa1ab;
  --accent:#2f6df6; --accent-soft:#eaf1ff;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --radius:14px;
  --c-만픽:#16a34a; --c-경계:#14b8a6; --c-장기보류:#f59e0b; --c-환경비합:#f97316;
  --c-거절:#ef4444; --c-차단:#b91c1c; --c-재가X:#9f1239; --c-중복섭외:#db2777;
  --c-다른번호:#64748b; --c-부재중:#9aa3af; --c-정신질환:#8b5cf6; --c-빈칸:#cbd5e1; --c-기타:#475569;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#171a20; --panel-2:#1b1f27; --border:#272c35;
  --text:#e8eaed; --muted:#9aa1ab; --faint:#6b7280; --accent:#5b8dff; --accent-soft:#1a2540;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); --c-부재중:#6b7280; --c-빈칸:#3a414c;
}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --panel-2:#1b1f27; --border:#272c35;
  --text:#e8eaed; --muted:#9aa1ab; --faint:#6b7280; --accent:#5b8dff; --accent-soft:#1a2540;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); --c-부재중:#6b7280; --c-빈칸:#3a414c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
.wrap{max-width:1100px; margin:0 auto; padding:26px 16px 90px}
header.top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap}
h1{font-size:22px; font-weight:780; letter-spacing:-.02em; margin:0}
.sub{color:var(--muted); font-size:13.5px; margin-top:4px}
.theme-btn{background:var(--panel); border:1px solid var(--border); color:var(--muted); border-radius:10px;
  padding:7px 12px; font-size:13px; cursor:pointer; box-shadow:var(--shadow)}
.theme-btn:hover{color:var(--text)}

.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px 18px; margin:16px 0}
.card h2{font-size:15px; font-weight:700; margin:0 0 3px; letter-spacing:-.01em}
.card .hint{font-size:12.5px; color:var(--faint); margin:0 0 14px}
.periodtag{font-weight:600; color:var(--accent); font-size:12.5px; background:var(--accent-soft); padding:2px 9px; border-radius:999px; margin-left:4px}

/* 연결 바 */
.conn{display:flex; gap:12px 14px; flex-wrap:wrap; align-items:center}
.conn .urlbox{flex:1 1 320px; display:flex; gap:8px; align-items:center; min-width:260px}
.conn input[type=text]{flex:1 1 auto; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:8px 10px; font-size:12.5px; font-family:ui-monospace,Menlo,monospace}
.status{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); font-weight:600}
.dot-st{width:9px; height:9px; border-radius:50%; background:var(--faint)}
.dot-st.live{background:var(--c-만픽)} .dot-st.snap{background:var(--c-장기보류)} .dot-st.err{background:var(--c-거절)}
.btn{background:var(--accent); color:#fff; border:none; border-radius:9px; padding:9px 15px; font-size:13.5px; font-weight:650; cursor:pointer; white-space:nowrap}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--border)}
.btn.sm{padding:6px 11px; font-size:12.5px}
.btn:hover{filter:brightness(1.05)} .btn:disabled{opacity:.5; cursor:default}
.setup{font-size:12px; color:var(--muted); margin-top:10px; background:var(--panel-2); border:1px dashed var(--border); border-radius:10px; padding:10px 12px}
.setup b{color:var(--text)} .setup code{background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:1px 5px; font-size:11px}
.setup a{color:var(--accent)}

/* 조회 조건 */
.query{display:flex; gap:14px 18px; flex-wrap:wrap; align-items:flex-end}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12px; color:var(--muted); font-weight:600}
.field input,.field select{background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:9px 11px; font-size:14px; font-family:inherit}
.field input:focus,.field select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
#qName{min-width:170px; font-weight:650}
.spacer{flex:1 1 auto}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:16px 0}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
.kpi .label{font-size:12px; color:var(--muted); font-weight:600}
.kpi .value{font-size:25px; font-weight:780; letter-spacing:-.02em; margin-top:3px}
.kpi .value small{font-size:13px; font-weight:600; color:var(--muted)}
.kpi.good .value{color:var(--c-만픽)}

/* detail */
.detail .dhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.detail .dname{font-size:19px; font-weight:780}
.badge{font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums}
.badge.good{background:rgba(22,163,74,.12); color:var(--c-만픽)}
.badge.ban{background:var(--panel-2); color:var(--muted); border:1px solid var(--border)}
.pbar{display:flex; height:26px; border-radius:8px; overflow:hidden; background:var(--panel-2); border:1px solid var(--border); margin:4px 0 14px}
.pseg{height:100%; position:relative}
.pseg span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:700; text-shadow:0 1px 1px rgba(0,0,0,.3)}
.closebtn{margin-left:auto; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer}

/* tables */
.tbl-scroll{overflow-x:auto; margin:0 -4px}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:560px}
th,td{padding:8px 10px; text-align:center; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; white-space:nowrap}
th{color:var(--muted); font-weight:650; font-size:11.5px; cursor:pointer; user-select:none; position:sticky; top:0; background:var(--panel)}
th.name,td.name{text-align:left; font-weight:650}
th:hover{color:var(--text)}
th .arr{font-size:9px; opacity:.6}
td.zero{color:var(--faint)}
td.mp{font-weight:750; color:var(--c-만픽)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel-2)}
tbody tr.sel td{background:var(--accent-soft)}
tr.total td{font-weight:750; border-top:2px solid var(--border); background:var(--panel-2); cursor:default}
tr.total:hover td{background:var(--panel-2)}
.catdot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px}
.cattbl td.name{font-weight:600}
.empty{padding:26px; text-align:center; color:var(--faint); font-size:13.5px}
.footnote{font-size:11.5px; color:var(--faint); margin-top:26px; text-align:center; line-height:1.7}
.footnote a{color:var(--accent)}
@media (max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>혁특 노방 분석실</h1>
    </div>
    <button class="theme-btn" id="themeBtn">◐ 테마</button>
  </header>

  <!-- 데이터 연결 -->
  <div class="card">
    <h2>데이터 연결</h2>
    <div class="conn">
      <div class="urlbox">
        <input type="text" id="sheetUrl" value="https://docs.google.com/spreadsheets/d/1YLVqyLPwpbLpATZJG227l6r1UbnILxWycmV4G1cDGJU/edit?gid=1287639185#gid=1287639185">
        <a class="btn ghost sm" id="openSheet" target="_blank" rel="noopener">시트 열기 ↗</a>
      </div>
      <button class="btn" id="loadBtn">🔄 시트에서 불러오기</button>
      <span class="status"><span class="dot-st snap" id="stDot"></span><span id="stText">내장 스냅샷 (2026-11-01)</span></span>
    </div>
  </div>

  <!-- 조회 조건 -->
  <div class="card">
    <h2>조회 조건</h2>
    <div class="query">
      <div class="field"><label for="qName">인도자 이름</label>
        <input type="text" id="qName" list="nameList" placeholder="ex) 김사랑" autocomplete="off">
        <datalist id="nameList"></datalist>
      </div>
      <div class="field"><label for="qFrom">시작일</label><input type="date" id="qFrom" value="2026-10-20"></div>
      <div class="field"><label for="qTo">종료일 (선택)</label><input type="date" id="qTo"></div>
      <div class="field"><label for="qBan">반</label><select id="qBan"><option value="">전체</option></select></div>
      <div class="spacer"></div>
      <button class="btn ghost sm" id="clearBtn">조건 초기화</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <!-- 상세 (선택 인도자) -->
  <div class="card detail" id="detailCard" style="display:none">
    <div class="dhead">
      <span class="dname" id="dName"></span>
      <span class="badge ban" id="dBan"></span>
      <span class="badge" id="dCnt"></span>
      <span class="badge good" id="dRate"></span>
      <button class="closebtn" id="dClose">✕ 선택 해제</button>
    </div>
    <div class="pbar" id="dBar"></div>
    <div class="tbl-scroll"><table class="cattbl" id="catTbl"></table></div>
  </div>

  <!-- 전체 인도자 표 -->
  <div class="card">
    <h2 id="listTitle">인도자별 집계</h2>
    <p class="hint">행을 클릭하면 상세가 열립니다. 머리글 클릭으로 정렬. 찾기수 = 해당 기간 TM 기록 수.</p>
    <div class="tbl-scroll"><table id="mainTbl"></table></div>
    <div class="empty" id="emptyMsg" style="display:none">해당 조건에 맞는 기록이 없습니다.</div>
  </div>

  <!-- 같은 기간 전체 집계 (이름 조건 무관) -->
  <div class="card" id="totalCard">
    <h2>📊 총집계 <span id="totalPeriod" class="periodtag"></span></h2>
    <div class="kpis" id="totalKpis" style="margin:0 0 14px"></div>
    <div class="pbar" id="totalBar"></div>
    <div class="tbl-scroll"><table class="cattbl" id="totalTbl"></table></div>
  </div>

  <div class="footnote">
    데이터 출처: <a href="https://docs.google.com/spreadsheets/d/1YLVqyLPwpbLpATZJG227l6r1UbnILxWycmV4G1cDGJU/edit?gid=1287639185#gid=1287639185" target="_blank" rel="noopener">한눈에 보는 혁특시트</a> · 1반오프·2반오프·3반오프·4반오프 탭<br>
    집계 대상: 인도자 이름 / 일보(보고)날짜 / TM 결과. 연락처 등 개인정보는 다루지 않습니다. 내장 스냅샷 기준일 2026-11-01.
  </div>
</div>

  ['부재중','var(--c-부재중)'],['정신질환','var(--c-정신질환)'],['(빈칸)','var(--c-빈칸)'],['기타','var(--c-기타)']
];
const CAT_ORDER = CATS.map(c=>c[0]);
const CAT_COLOR = Object.fromEntries(CATS);
function normCat(tm){ if(tm==null||String(tm).trim()==='') return '(빈칸)'; const t=String(tm).trim(); return CAT_ORDER.includes(t)?t:'기타'; }

/* ---- 날짜 파싱 (local) ---- */
function parseDate(s, yr){
  if(s==null) return null; s=String(s).trim(); if(!s) return null; let m;
  m=s.match(/^(\d{4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);         // 2026-10-20 / 2026.10.20
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/);               // 10/20/2026
  if(m) return new Date(+m[3],+m[1]-1,+m[2]);
  m=s.match(/^(\d{1,2})[.\-\/](\d{1,2})$/);                            // 10/20 (연도 없음)
  if(m) return new Date(yr,+m[1]-1,+m[2]);
  const d=new Date(s); return isNaN(d)?null:d;
}
function localD(v){ const p=v.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
const YR=2026;

/* ---- 필터 + 집계 ---- */
const EXCLUDE=['김진래','이가영'];   // 집계·목록에서 제외할 이름
let sortKey='찾기수', sortDir=-1, selected=null; // selected = 인도자 이름
function getFilter(){
  let nm=document.getElementById('qName').value.trim();
  if(nm==='전체') nm='';   // '전체' 선택 = 이름 조건 없음
  const fromV=document.getElementById('qFrom').value, toV=document.getElementById('qTo').value;
  const from=fromV?localD(fromV):null; let to=toV?localD(toV):null; if(to) to.setHours(23,59,59,999);
  const ban=document.getElementById('qBan').value;
  return {nm,from,to,ban};
}
function filtered(){
  const f=getFilter(); const out=[]; let undated=0;
  for(const r of ROWS){
    const [ds,b,g,tm]=r;
    if(!g || EXCLUDE.includes(g)) continue;
    if(f.ban!=='' && String(b)!==f.ban) continue;
    if(f.nm && !g.includes(f.nm)) continue;
    const d=parseDate(ds,YR);
    if(f.from){ if(!d){undated++; continue;} if(d<f.from) continue; }
    if(f.to && d && d>f.to) continue;
    out.push({d, ban:b, name:g, cat:normCat(tm)});
  }
  return {rows:out, undated};
}
function groupByName(rows){
  const g={};
  for(const r of rows){
    const k=r.name;
    if(!g[k]) g[k]={name:k, bans:new Set(), total:0, counts:{}};
    g[k].total++; g[k].bans.add(r.ban);
    g[k].counts[r.cat]=(g[k].counts[r.cat]||0)+1;
  }
  return Object.values(g);
}
function activeCats(rows){ const s=new Set(rows.map(r=>r.cat)); return CAT_ORDER.filter(c=>s.has(c)); }

/* ---- 렌더 ---- */
function render(){
  const {rows,undated}=filtered();
  const cats=activeCats(rows);
  const groups=groupByName(rows);
  renderKpis(rows,groups,undated);
  renderMain(groups,cats,rows.length);
  renderDetail(groups,rows);
  renderTotal();
  const f=getFilter();
  document.getElementById('listTitle').textContent = f.nm? `‘${f.nm}’ 검색 결과` : '인도자별 집계';
}
function pct(a,b){ return b? (a/b*100):0; }
function fmtD(d){ return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }
/* 기간+반만 적용(이름 무시)한 전체 행 */
function filteredAll(){
  const f=getFilter(); const out=[];
  for(const r of ROWS){ const [ds,b,g,tm]=r; if(!g) continue;
    if(f.ban!=='' && String(b)!==f.ban) continue;
    const d=parseDate(ds,YR);
    if(f.from){ if(!d) continue; if(d<f.from) continue; }
    if(f.to && d && d>f.to) continue;
    out.push({name:g, cat:normCat(tm)});
  }
  return out;
}
function renderTotal(){
  // 기간만 적용 (반·이름 무시) — 대상은 항상 1~4반 전체
  const f=getFilter();
  const rows=[];
  for(const r of ROWS){ const [ds,b,g,tm]=r; if(!g || EXCLUDE.includes(g)) continue;
    const d=parseDate(ds,YR);
    if(f.from){ if(!d) continue; if(d<f.from) continue; }
    if(f.to && d && d>f.to) continue;
    rows.push({name:g, cat:normCat(tm)});
  }
  const N=rows.length, mp=rows.filter(r=>r.cat==='만픽').length;
  const people=new Set(rows.map(r=>r.name)).size;
  let lab=(f.from?fmtD(f.from):'전체')+' ~ '+(f.to?fmtD(f.to):(f.from?'현재':'전체'));
  document.getElementById('totalPeriod').textContent=lab;
  // KPI
  const kp=document.getElementById('totalKpis'); kp.innerHTML='';
  [['찾기수(TM 기록)',N+'<small> 건</small>',false],['만픽',mp+'<small> 건</small>',true],
   ['만픽률',pct(mp,N).toFixed(1)+'<small>%</small>',true],['인도자 수',people+'<small> 명</small>',false]]
  .forEach(([l,v,g])=>{ const d=document.createElement('div'); d.className='kpi'+(g?' good':'');
    d.innerHTML=`<div class="label">${l}</div><div class="value">${v}</div>`; kp.appendChild(d); });
  // 카운트
  const counts={}; for(const r of rows) counts[r.cat]=(counts[r.cat]||0)+1;
  const cats=CAT_ORDER.filter(c=>counts[c]);
  // 막대
  let bar=''; for(const c of cats){ const v=counts[c]; const w=v/N*100;
    bar+=`<div class="pseg" style="flex:0 0 ${w}%;background:${CAT_COLOR[c]}" title="${c}: ${v}건 (${w.toFixed(1)}%)">`+(w>=7?`<span>${v}</span>`:'')+`</div>`; }
  document.getElementById('totalBar').innerHTML = N? bar : '';
  // 표 (비율 높은 순)
  const catsSorted=[...cats].sort((a,b)=>counts[b]-counts[a]);
  let H='<tr><th class="name">TM 결과</th><th>건수</th><th>비율</th></tr>';
  for(const c of catsSorted){ const v=counts[c]; H+=`<tr><td class="name"><span class="catdot" style="background:${CAT_COLOR[c]}"></span>${c}</td><td>${v}</td><td>${pct(v,N).toFixed(1)}%</td></tr>`; }
  H+=`<tr class="total"><td class="name">합계</td><td>${N}</td><td>100%</td></tr>`;
  document.getElementById('totalTbl').innerHTML = N? H : '<tr><td class="name" style="color:var(--faint)">해당 기간 데이터가 없습니다.</td></tr>';
}
function renderKpis(rows,groups,undated){
  const N=rows.length, mp=rows.filter(r=>r.cat==='만픽').length;
  const el=document.getElementById('kpis'); el.innerHTML='';
  const items=[
    ['찾기수(TM 기록)', N+'<small> 건</small>', false],
    ['만픽', mp+'<small> 건</small>', true],
    ['만픽률', pct(mp,N).toFixed(1)+'<small>%</small>', true],
    ['인도자 수', groups.length+'<small> 명</small>', false],
  ];
  for(const [l,v,g] of items){
    const d=document.createElement('div'); d.className='kpi'+(g?' good':'');
    d.innerHTML=`<div class="label">${l}</div><div class="value">${v}</div>`; el.appendChild(d);
  }
}
function sortGroups(groups){
  const val=(x)=> sortKey==='찾기수'?x.total : sortKey==='만픽률'?pct(x.counts['만픽']||0,x.total) : (x.counts[sortKey]||0);
  groups.sort((a,b)=>{
    if(sortKey==='이름') return sortDir*a.name.localeCompare(b.name,'ko');
    const d=val(a)-val(b);
    return sortDir*(d!==0? d : a.name.localeCompare(b.name,'ko'));
  });
  return groups;
}
function renderMain(groups,cats,totalRows){
  const t=document.getElementById('mainTbl'); const empty=document.getElementById('emptyMsg');
  if(!groups.length){ t.innerHTML=''; empty.style.display='block'; return; } empty.style.display='none';
  sortGroups(groups);
  const arrow=k=> sortKey===k? `<span class="arr">${sortDir<0?'▼':'▲'}</span>`:'';
  let head='<tr>'+
    `<th class="name" data-k="이름">인도자 ${arrow('이름')}</th>`+
    `<th data-k="반">반</th>`+
    `<th data-k="찾기수">찾기수 ${arrow('찾기수')}</th>`+
    `<th data-k="만픽률">만픽률 ${arrow('만픽률')}</th>`;
  for(const c of cats) head+=`<th data-k="${c}">${c} ${arrow(c)}</th>`;
  head+='</tr>';
  let body='';
  const tot={total:0,counts:{}};
  for(const g of groups){
    tot.total+=g.total; for(const c of cats) tot.counts[c]=(tot.counts[c]||0)+(g.counts[c]||0);
    const rate=pct(g.counts['만픽']||0,g.total);
    const bans=[...g.bans].filter(x=>x!=null).sort((a,b)=>a-b).join(',');
    let tds=''; for(const c of cats){ const v=g.counts[c]||0; tds+=`<td class="${v?'':'zero'}">${v||'·'}</td>`; }
    body+=`<tr data-name="${g.name}" class="${selected===g.name?'sel':''}">`+
      `<td class="name">${g.name}</td><td>${bans||'·'}</td><td><b>${g.total}</b></td>`+
      `<td class="mp">${rate.toFixed(1)}%</td>${tds}</tr>`;
  }
  let ttds=''; for(const c of cats){ ttds+=`<td>${tot.counts[c]||0}</td>`; }
  body+=`<tr class="total"><td class="name">전체 ${groups.length}명</td><td>·</td><td>${tot.total}</td>`+
    `<td class="mp">${pct(tot.counts['만픽']||0,tot.total).toFixed(1)}%</td>${ttds}</tr>`;
  t.innerHTML=head+body;
  t.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k==='반'?'반':th.dataset.k; if(k==='반') return;
    if(sortKey===k) sortDir*=-1; else{ sortKey=k; sortDir=(k==='이름')?1:-1; } render();
  });
  t.querySelectorAll('tr[data-name]').forEach(tr=>tr.onclick=()=>{
    selected = selected===tr.dataset.name? null : tr.dataset.name; render();
    if(selected) document.getElementById('detailCard').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function renderDetail(groups,rows){
  const card=document.getElementById('detailCard');
  let sel=selected;
  // 이름 입력이 정확히 한 명이면 자동 선택
  const f=getFilter();
  if(!sel && f.nm){ const exact=groups.filter(g=>g.name===f.nm); if(exact.length===1) sel=exact[0].name; }
  if(!sel || !groups.some(g=>g.name===sel)){ card.style.display='none'; return; }
  const g=groups.find(x=>x.name===sel);
  card.style.display='block';
  document.getElementById('dName').textContent=g.name;
  const bans=[...g.bans].filter(x=>x!=null).sort((a,b)=>a-b).join('·');
  document.getElementById('dBan').textContent= bans? bans+'반':'반 미상';
  document.getElementById('dCnt').textContent='찾기수 '+g.total+'건';
  document.getElementById('dRate').textContent='만픽률 '+pct(g.counts['만픽']||0,g.total).toFixed(1)+'%';
  // bar
  const cats=CAT_ORDER.filter(c=>g.counts[c]);
  let bar=''; for(const c of cats){ const v=g.counts[c]; const w=v/g.total*100;
    bar+=`<div class="pseg" style="flex:0 0 ${w}%;background:${CAT_COLOR[c]}" title="${c}: ${v}건 (${w.toFixed(1)}%)">`+(w>=8?`<span>${v}</span>`:'')+`</div>`; }
  document.getElementById('dBar').innerHTML=bar;
  // category table
  let rowsH='<tr><th class="name">TM 결과</th><th>건수</th><th>비율</th></tr>';
  for(const c of cats){ const v=g.counts[c]; rowsH+=`<tr><td class="name"><span class="catdot" style="background:${CAT_COLOR[c]}"></span>${c}</td><td>${v}</td><td>${pct(v,g.total).toFixed(1)}%</td></tr>`; }
  rowsH+=`<tr class="total"><td class="name">합계</td><td>${g.total}</td><td>100%</td></tr>`;
  document.getElementById('catTbl').innerHTML=rowsH;
}

/* ---- 이름 자동완성 / 반 셀렉트 ---- */
function refreshLists(){
  const names=[...new Set(ROWS.map(r=>r[2]).filter(n=>n && !EXCLUDE.includes(n)))].sort((a,b)=>a.localeCompare(b,'ko'));
  document.getElementById('nameList').innerHTML='<option value="전체">'+names.map(n=>`<option value="${n}">`).join('');
  const sel=document.getElementById('qBan'); const cur=sel.value;
  const bans=[...new Set(ROWS.map(r=>r[1]).filter(x=>x!=null&&x!==''))].sort((a,b)=>a-b);
  sel.innerHTML='<option value="">전체</option>'+bans.map(b=>`<option value="${b}">${b}반</option>`).join('');
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
}

/* ---- CSV 파서 (gviz 응답용) ---- */
function parseCSV(text){
  text=text.replace(/\r\n?/g,'\n'); const rows=[]; let i=0,f='',row=[],q=false;
  while(i<text.length){ const ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=ch;i++;continue; }
    if(ch=='"'){q=true;i++;continue;}
    if(ch==','){row.push(f);f='';i++;continue;}
    if(ch=='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=ch;i++;
  } row.push(f);rows.push(row); return rows;
}
function ingestGrid(grid, banFallback){
  let hi=-1,H=null;
  for(let r=0;r<Math.min(grid.length,15);r++){ const line=grid[r].map(x=>(x||'').trim());
    if(line.includes('인도자') && line.some(x=>x.replace(/\s/g,'')==='TM결과')){ hi=r;H=line;break; } }
  if(hi<0) throw new Error('헤더(인도자/TM 결과)를 찾지 못함');
  const gi=H.indexOf('인도자');
  const ti=H.findIndex(x=>x.replace(/\s/g,'')==='TM결과');
  let di=H.findIndex(x=>['일보날짜','보고일','날짜'].includes(x)); if(di<0) di=0;
  let bi=H.indexOf('반');
  const out=[];
  for(let r=hi+1;r<grid.length;r++){ const line=grid[r];
    const g=(line[gi]||'').trim(); if(!g) continue;
    const tm=(line[ti]||'').trim(); const ds=(line[di]||'').trim();
    let b=bi>=0?(line[bi]||'').trim():''; b=b||banFallback;
    out.push([ds||null, (b!==''&&b!=null)?(isNaN(+b)?b:+b):null, g, tm||null]);
  }
  return out;
}
function sheetId(url){ const m=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/); return m?m[1]:null; }

async function loadFromSheet(){
  const btn=document.getElementById('loadBtn'); const dot=document.getElementById('stDot'); const txt=document.getElementById('stText');
  const id=sheetId(document.getElementById('sheetUrl').value);
  if(!id){ setStatus('err','URL에서 시트 ID를 못 찾음'); return; }
  btn.disabled=true; btn.textContent='불러오는 중…'; setStatus('','연결 중…');
  try{
    const all=[];
    for(const tab of SHEET_TABS){
      const banFallback=(tab.match(/^(\d+)반/)||[])[1]||null;
      const u=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
      const res=await fetch(u,{credentials:'omit'});
      const text=await res.text();
      if(!res.ok || /^\s*</.test(text)) throw new Error(tab+' 탭 접근 불가 — 시트 공유 설정(뷰어)을 확인하세요');
      all.push(...ingestGrid(parseCSV(text), banFallback));
    }
    if(!all.length) throw new Error('데이터가 비어 있음');
    ROWS=all; refreshLists();
    const now=new Date(); const hhmm=now.toLocaleString('ko-KR',{hour:'2-digit',minute:'2-digit',month:'numeric',day:'numeric'});
    setStatus('live',`시트 실시간 · ${all.length}건 · ${hhmm} 불러옴`);
    render();
  }catch(e){ let m=(''+e.message);
    if(/fetch|load failed|network|cors/i.test(m)) m='시트에 연결 못함 (공유 설정·네트워크 확인)';
    setStatus('err', m.slice(0,70)+' · 내장 스냅샷 사용'); }
  finally{ btn.disabled=false; btn.textContent='🔄 시트에서 불러오기'; }
}
function setStatus(kind,msg){ const d=document.getElementById('stDot'),t=document.getElementById('stText');
  d.className='dot-st'+(kind?(' '+kind):''); t.textContent=msg; }

/* ---- 이벤트 ---- */
let deb;
['qFrom','qTo','qBan'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{selected=null;render();}));
document.getElementById('qName').addEventListener('input',()=>{ selected=null; clearTimeout(deb); deb=setTimeout(render,180); });
document.getElementById('clearBtn').onclick=()=>{ document.getElementById('qName').value=''; document.getElementById('qFrom').value='2026-10-20';
  document.getElementById('qTo').value=''; document.getElementById('qBan').value=''; selected=null; render(); };
document.getElementById('dClose').onclick=()=>{ selected=null; document.getElementById('qName').value=''; render(); };
document.getElementById('loadBtn').onclick=loadFromSheet;
document.getElementById('themeBtn').onclick=()=>{ const r=document.documentElement; const cur=r.getAttribute('data-theme');
  const dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme',dark?'light':'dark'); };
(function(){ const u=document.getElementById('sheetUrl').value; document.getElementById('openSheet').href=u; })();
document.getElementById('sheetUrl').addEventListener('change',e=>{ document.getElementById('openSheet').href=e.target.value; });

/* 초기 */
refreshLists(); render();
// 페이지 열 때 시트에서 자동으로 최신 데이터 불러오기 (실패하면 내장 스냅샷 유지)
loadFromSheet();
